plugins {
    id 'com.android.application'
}

android {
    namespace 'uk.co.rahimachowdhury.tlevelcore'
    compileSdk 36

    defaultConfig {
        applicationId 'uk.co.rahimachowdhury.tlevelcore'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
