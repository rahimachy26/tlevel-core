<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T Level Engineering Core — Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1d2433; --muted:#5b6475; --line:#e2ded4;
  --brand:#0f4c5c; --brand-2:#e36414; --ok:#2a7d4f; --ok-bg:#e3f3e9; --bad:#b3261e; --bad-bg:#fbe7e5;
  --sel:#fff2c6; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
h1,h2,h3,.disp{font-family:"Space Grotesk",system-ui,sans-serif;letter-spacing:-.01em;line-height:1.2}
button{font:inherit;cursor:pointer}
a{color:var(--brand)}
header.top{background:var(--brand);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header.top .logo{font-family:"Space Grotesk";font-weight:700;font-size:19px;cursor:pointer;display:flex;align-items:center;gap:10px}
header.top .logo .badge{background:var(--brand-2);border-radius:8px;padding:2px 8px;font-size:14px}
header.top .sp{flex:1}
header.top nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 14px;margin-left:6px}
header.top nav button:hover,header.top nav button.on{background:#fff;color:var(--brand)}
main{max-width:1080px;margin:0 auto;padding:24px 18px 70px}
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-bottom:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.hero h1{margin:0 0 6px;font-size:30px}
.hero p{margin:0;color:var(--muted)}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat div{flex:1;min-width:110px}
.stat b{display:block;font-family:"Space Grotesk";font-size:30px;color:var(--brand)}
.stat span{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:transform .12s,box-shadow .12s;color:var(--ink)}
.ucard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,76,92,.12)}
.ucard .num{font-family:"Space Grotesk";font-weight:700;font-size:13px;color:#fff;background:var(--brand);border-radius:6px;padding:2px 8px;align-self:flex-start}
.ucard h3{margin:0;font-size:17px}
.bar{height:7px;background:#ece8de;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.special{background:linear-gradient(135deg,#0f4c5c,#1b6f80);color:#fff;border:none}
.special .num{background:var(--brand-2)}
.special .meta{color:#d6eef2}
.back{background:none;border:none;color:var(--brand);padding:0;margin-bottom:10px;font-weight:700}
.uhead h1{margin:4px 0 4px;font-size:28px}
.uhead p{margin:0 0 14px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:none;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--brand);border-color:var(--brand-2)}
.sections{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.sections li{background:#e8f1f3;color:var(--brand);border-radius:999px;padding:4px 12px;font-size:14px}
.points{margin:0;padding-left:0;list-style:none;counter-reset:p}
.points li{counter-increment:p;position:relative;padding:10px 0 10px 44px;border-bottom:1px dashed var(--line)}
.points li::before{content:counter(p);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-family:"Space Grotesk";font-weight:700;display:grid;place-items:center;font-size:14px}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.flip{perspective:900px;height:130px;background:none;border:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:12px;display:grid;place-items:center;text-align:center;border:1px solid var(--line)}
.flip .f{background:#fff;font-family:"Space Grotesk";font-weight:700;font-size:17px;color:var(--brand)}
.flip .b{background:var(--brand);color:#fff;transform:rotateY(180deg);font-size:15px}
.act{margin-bottom:22px}
.act h3{margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act .hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.tag{font-size:12px;background:var(--brand-2);color:#fff;border-radius:6px;padding:2px 8px;font-family:"Atkinson Hyperlegible"}
.done-tag{font-size:12px;background:var(--ok);color:#fff;border-radius:6px;padding:2px 8px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;color:var(--ink)}
.chip.sel{background:var(--sel);border-color:#d9a400}
.chip.ok{background:var(--ok-bg);border-color:var(--ok)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:10px;border:2px dashed var(--line);border-radius:12px;margin-bottom:12px;background:#fbfaf7}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.bucket{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:120px;background:#fff;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.bucket.ready{border-color:#d9a400;background:#fffbea}
.bucket h4{margin:0 0 4px;font-family:"Space Grotesk";color:var(--brand)}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .chip.gone{opacity:.45;pointer-events:none}
.orderlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.orderlist li{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.orderlist li.ok{background:var(--ok-bg);border-color:var(--ok)}
.orderlist li.bad{background:var(--bad-bg);border-color:var(--bad)}
.orderlist li span{flex:1}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:9px 18px;font-weight:700}
.btn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn.orange{background:var(--brand-2)}
.btn:disabled{opacity:.5;cursor:default}
.fb{font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.calc{display:flex;flex-direction:column;gap:12px}
.calc .q{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.calc input{font:inherit;width:140px;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px}
.calc input.ok{border-color:var(--ok);background:var(--ok-bg)} .calc input.bad{border-color:var(--bad);background:var(--bad-bg)}
.work{margin-top:6px;color:var(--muted);font-size:15px;background:#f4f7f8;border-radius:8px;padding:6px 10px}
textarea{width:100%;min-height:130px;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;resize:vertical}
.model{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:6px}
.model label{display:flex;gap:10px;align-items:flex-start;background:#f4f7f8;border-radius:8px;padding:8px 10px;cursor:pointer}
.quiz .qq{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px}
.quiz .qq h4{margin:0 0 10px;font-family:"Atkinson Hyperlegible";font-size:17px}
.quiz .qq .src{font-size:12px;color:var(--muted);font-weight:400;display:block;margin-bottom:4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:left;color:var(--ink)}
.opt .l{font-family:"Space Grotesk";font-weight:700;width:24px;height:24px;border-radius:50%;background:#ece8de;display:grid;place-items:center;font-size:13px;flex:none}
.opt.picked{border-color:var(--brand);background:#e8f1f3}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.explain{margin-top:8px;font-size:15px;color:var(--muted)}
.score{display:flex;align-items:center;gap:18px;padding:18px;border-radius:var(--radius);background:var(--brand);color:#fff;margin-bottom:16px;flex-wrap:wrap}
.score b{font-family:"Space Grotesk";font-size:42px}
.timer{font-family:"Space Grotesk";font-weight:700;background:var(--brand-2);color:#fff;border-radius:10px;padding:6px 14px}
.sticky{position:sticky;top:64px;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:16px}
.breakdown div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.search{width:100%;font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:14px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.gloss div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.gloss b{color:var(--brand)} .gloss small{color:var(--muted);display:block}
.setup label{display:block;margin:8px 0}
.setup select{font:inherit;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line)}
.who{font-size:14px;opacity:.9}
.banner{background:#fff4e5;border:1px solid #f0c38a;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:15px}
.reg{max-width:520px;margin:30px auto}
.reg input,.reg select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:4px 0 12px}
table.res{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px}
table.res th,table.res td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.res th{background:#e8f1f3;color:var(--brand);font-family:"Space Grotesk"}
table.res td:first-child,table.res th:first-child{text-align:left}
table.res tr.click{cursor:pointer} table.res tr.click:hover td{background:#fbfaf7}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.c-hi{background:#e3f3e9!important}.c-mid{background:#fff6dc!important}.c-lo{background:#fbe7e5!important}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.toolbar select,.toolbar input{font:inherit;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px}
.lenpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tips{margin:6px 0 0;padding-left:20px}.tips li{margin:4px 0}
details summary{cursor:pointer}
footer{color:var(--muted);font-size:13px;text-align:center;padding:20px}
@media (max-width:760px){.hero{grid-template-columns:1fr}.match{grid-template-columns:1fr}header.top nav{width:100%}header.top nav button{margin:4px 4px 0 0}}
</style>
</head>
<body>
<header class="top">
  <div class="logo" id="home-link"><span class="badge">T Level</span> Engineering Core</div>
  <div class="sp"></div>
  <nav>
    <button data-go="home">Units</button>
    <button data-go="mock">Full mock exam</button>
    <button data-go="exam">Exam practice</button>
    <button data-go="glossary">Glossary</button>
    <button data-go="my-results">My results</button>
    <button data-go="teacher" id="nav-teacher" hidden>Teacher</button>
  </nav>
  <span id="who" class="who"></span>
</header>
<main id="app"></main>
<footer>Original study material written to follow the Engineering &amp; Manufacturing T Level Core (Units 1–17).</footer>
<script>
const UNITS = [];
UNITS.push({
n:1, title:"Working within the engineering and manufacturing sectors",
sections:["1.1 Design principles and methodologies","1.2 Maintenance, repair and installation","1.3 Manufacturing, processing and control"],
overview:"How engineers design products, how they are made at different scales, and how equipment is kept running safely and efficiently.",
points:[
"A linear design process moves through fixed stages in order; an iterative process loops back to test, evaluate and refine ideas repeatedly.",
"User-centred design puts the needs of the end user at the centre; inclusive design aims to work for as many people as possible; sustainable design reduces environmental impact across the product's life.",
"Main process families: wasting (removing material, e.g. milling, turning, drilling), shaping (e.g. casting, moulding), forming (e.g. bending, forging, pressing), joining (e.g. welding, bolting, adhesives) and additive manufacturing (3D printing).",
"Scales of production: one-off (bespoke), batch (set quantity), mass (large volumes, often on a line) and continuous (runs 24/7, e.g. chemicals, steel).",
"Planned preventive maintenance is done on a schedule; predictive (condition-based) maintenance uses monitoring data such as vibration or temperature; reactive (corrective) maintenance happens after a breakdown.",
"Good maintenance reduces unplanned downtime, extends equipment life, keeps people safe and cuts waste and energy use.",
"Automation and robotics give repeatability, speed and safety for dangerous or repetitive tasks, but need high capital investment and skilled maintenance staff.",
"Quality assurance (QA) prevents defects by controlling the process; quality control (QC) finds defects by inspecting the product."
],
terms:[["Iterative design","A cyclic process of designing, testing and refining until the solution meets the brief"],["Wasting","Removing material to create a shape, e.g. turning or milling"],["Forming","Changing shape without removing material, e.g. bending or forging"],["Additive manufacturing","Building a part layer by layer from a CAD model"],["Batch production","Making a fixed quantity of identical items before switching to another product"],["Predictive maintenance","Servicing equipment based on monitored condition data"],["Reactive maintenance","Repairing equipment only after it has failed"],["Prototype","An early working model used to test a design"]],
activities:[
{type:"sort",title:"Sort the processes into their families",cats:["Wasting","Forming","Joining","Additive"],items:[["CNC milling",0],["Drilling",0],["Turning on a lathe",0],["Press-brake bending",1],["Drop forging",1],["Deep drawing",1],["MIG welding",2],["Riveting",2],["Soldering",2],["Fused deposition modelling (FDM)",3],["Selective laser sintering (SLS)",3]]},
{type:"sort",title:"Which scale of production?",cats:["One-off","Batch","Mass","Continuous"],items:[["A replacement part for a vintage steam engine",0],["A bespoke bridge",0],["500 brackets for a local contractor",1],["Seasonal bakery products",1],["Family hatchback cars",2],["Smartphones",2],["Oil refining",3],["Float glass manufacture",3]]},
{type:"scenario",title:"Choosing a maintenance strategy",prompt:"A food factory runs a packaging line 20 hours a day. Unplanned stoppages last month cost 40 hours of production. Recommend a maintenance strategy and justify your choice.",marks:6,model:["Move away from purely reactive maintenance, which is causing the costly unplanned downtime","Introduce planned preventive maintenance during the 4-hour non-production window","Add condition monitoring (vibration, temperature, motor current) to key items for predictive maintenance","Keep critical spares in stock to cut repair time","Log every failure to find repeat causes (root cause analysis)","Weigh cost of monitoring equipment and training against lost production cost"]}
],
quiz:[
{q:"Which design approach repeatedly tests and refines a solution?",o:["Iterative design","Linear design","Reverse engineering","Value engineering"],e:"Iterative design loops through design, test and evaluate until the brief is met."},
{q:"Turning a shaft on a lathe is an example of which process family?",o:["Wasting","Forming","Joining","Additive"],e:"Material is removed as swarf, so it is a wasting process."},
{q:"Which scale of production is best for 24/7 production of chemicals?",o:["Continuous","Batch","One-off","Jobbing"],e:"Continuous production runs non-stop for very high-volume products."},
{q:"Maintenance carried out using vibration and temperature data is called:",o:["Predictive (condition-based) maintenance","Reactive maintenance","Breakdown maintenance","Corrective maintenance"],e:"Predictive maintenance acts on measured condition data before failure."},
{q:"Which statement describes quality assurance?",o:["It prevents defects by controlling the process","It inspects finished parts to find defects","It only happens at the end of the line","It replaces the need for SOPs"],e:"QA is preventive and process-focused; QC is inspection-focused."},
{q:"Inclusive design aims to:",o:["Make products usable by as many people as possible","Use as few parts as possible","Copy nature's solutions","Reduce production cost only"],e:"Inclusive design considers people of different abilities, ages and sizes."},
{q:"Which is a main disadvantage of introducing automation?",o:["High initial capital cost","Lower repeatability","Greater risk to operators on hazardous tasks","Slower cycle times"],e:"Automation improves repeatability and safety but costs a lot up front."},
{q:"Why are prototypes often made by additive manufacturing?",o:["Complex shapes can be made quickly without tooling","It is the cheapest way to mass-produce","It gives the strongest possible parts","It needs no CAD model"],e:"AM needs no moulds or jigs, so one-off complex parts are fast to make."},
{q:"Making 300 identical brackets, then retooling for a different part, is:",o:["Batch production","Mass production","Continuous production","One-off production"],e:"A set quantity followed by a changeover is batch production."},
{q:"Which is NOT a benefit of planned preventive maintenance?",o:["It removes the need for any spare parts","It reduces unplanned downtime","It extends equipment life","It allows work to be scheduled outside production"],e:"Spare parts are still needed; PPM simply makes their use predictable."}
]});

UNITS.push({
n:2, title:"Engineering and manufacturing past, present and future",
sections:["2.1 Sectors of the engineering industry","2.2 Historical technological advances","2.3 Innovation and emerging trends"],
overview:"The main engineering sectors, how the industrial revolutions shaped modern engineering, and the technologies changing it now.",
points:[
"Key UK sectors include aerospace, automotive, rail, marine, energy (including renewables and nuclear), electrical/electronic, chemical and process, mechanical, civil/structural, defence and biomedical.",
"1st industrial revolution (c.1760 on): water and steam power, mechanisation of textiles, iron production.",
"2nd industrial revolution (late 1800s): electricity, steel (Bessemer process), the moving assembly line and mass production (Ford, 1913).",
"3rd industrial revolution (from c.1970s): electronics, computers, PLCs, CNC machines and automation.",
"4th industrial revolution (Industry 4.0): cyber-physical systems, Internet of Things (IoT), big data, AI, cloud computing and digital twins.",
"Standardisation and interchangeable parts (e.g. Whitworth's standard screw thread) made mass production and easy repair possible.",
"Emerging trends: additive manufacturing, collaborative robots (cobots), electric and hydrogen vehicles, smart and nano materials, renewable energy, AI-driven predictive maintenance.",
"New technology brings economic impacts (new jobs and skills, some job losses), social impacts and environmental impacts that engineers must weigh up."
],
terms:[["Industry 4.0","The fourth industrial revolution: connected, data-driven, smart manufacturing"],["Internet of Things (IoT)","Physical devices with sensors that share data over a network"],["Digital twin","A live virtual model of a real product or process, updated with real data"],["Cobot","A collaborative robot designed to work safely alongside people"],["Interchangeable parts","Parts made to standard sizes so any one can replace another"],["Mechanisation","Using machines to replace manual labour"],["Logistics","Planning and moving materials and goods through the supply chain"]],
activities:[
{type:"sort",title:"Place each development in its industrial revolution",cats:["1st","2nd","3rd","4th"],items:[["Steam engine powering mills",0],["Spinning machines in textile mills",0],["Moving assembly line",1],["Widespread electric power",1],["Bessemer steel process",1],["First PLC replaces relay panels",2],["CNC machine tools",2],["IoT sensors streaming machine data to the cloud",3],["AI predicting machine failure",3],["Digital twin of a factory",3]]},
{type:"order",title:"Put these in chronological order (earliest first)",items:["Steam power in factories","Standardised screw threads","Moving assembly line for cars","Programmable logic controller","Industrial 3D printing becomes widespread","Digital twins and AI in smart factories"]},
{type:"scenario",title:"Impact of a new technology",prompt:"A car parts supplier plans to install cobots on its assembly line. Explain two economic and two social impacts.",marks:4,model:["Economic: higher productivity and consistent quality lower the cost per part","Economic: large initial investment, plus new costs for programming and maintenance","Social: some repetitive manual jobs may be lost or changed","Social: new, higher-skilled roles (robot technicians, programmers) and a need for retraining","Social: fewer injuries from repetitive or heavy tasks"]}
],
quiz:[
{q:"Which industrial revolution is most associated with steam power?",o:["First","Second","Third","Fourth"],e:"Steam and water power drove the first industrial revolution."},
{q:"Henry Ford's moving assembly line (1913) is part of which revolution?",o:["Second","First","Third","Fourth"],e:"Electricity, steel and mass production define the second revolution."},
{q:"A virtual model updated in real time with data from a real machine is a:",o:["Digital twin","CAD drawing","Prototype","Simulation-only model"],e:"A digital twin mirrors its physical twin using live data."},
{q:"Why were interchangeable parts so important?",o:["Any part could replace another, enabling mass production and easy repair","They made every product unique","They removed the need for measurement","They were cheaper to design"],e:"Standard sizes allow assembly and repair without hand-fitting."},
{q:"Which technology is most closely linked to the third industrial revolution?",o:["Programmable logic controllers","Water wheels","Cloud-connected IoT sensors","The Bessemer converter"],e:"Electronics, computers, PLCs and CNC define the third revolution."},
{q:"A cobot differs from a traditional industrial robot because it:",o:["Is designed to work safely alongside people","Always works inside a safety cage","Cannot be reprogrammed","Is only used for welding"],e:"Cobots have force limiting and sensors so they can share space with workers."},
{q:"Which sector designs and builds aircraft and spacecraft?",o:["Aerospace","Marine","Automotive","Rail"],e:"Aerospace covers aircraft, satellites and space vehicles."},
{q:"Which is an environmental benefit of additive manufacturing?",o:["Less material waste than machining from solid","It uses no energy","All AM plastics are biodegradable","It needs no design work"],e:"AM only uses the material needed for the part."},
{q:"What does IoT stand for?",o:["Internet of Things","Integration of Technology","Input/Output Terminal","Industrial Operating Technology"],e:"Internet of Things: connected devices sharing data."},
{q:"Which is a likely social impact of widespread factory automation?",o:["Demand for higher-skilled technical jobs","No need for any training","Increased manual heavy lifting","Fewer engineers needed to maintain machines"],e:"Automation shifts work towards programming, maintenance and data roles."}
]});

UNITS.push({
n:3, title:"Engineering representations",
sections:["3.1 Drawings and the information they convey","3.2 Dimensions and tolerancing"],
overview:"Reading and producing engineering drawings, circuit and system diagrams, and understanding dimensions, tolerances and fits to BS 8888.",
points:[
"BS 8888 is the UK standard for technical product documentation (engineering drawings).",
"Orthographic projection shows separate 2D views (front, side, plan). In first angle the plan is drawn below the front view; in third angle it is drawn above. A projection symbol on the title block shows which is used.",
"Pictorial drawings: isometric (receding lines at 30°), oblique (front face true shape, depth at 45°), perspective (vanishing points).",
"Line types: continuous thick = visible outlines; thin dashed = hidden detail; thin chain = centre lines; thin chain with thick ends = cutting planes; continuous thin = dimension, projection and hatching lines.",
"Sectional views show inside a part; cut surfaces are hatched with thin lines, usually at 45°.",

"Failure modes: fatigue (repeated cyclic loading), creep (slow deformation under constant load, often at high temperature: primary, secondary, tertiary), corrosion, wear, brittle fracture, overload.",
"Destructive tests: tensile test (stress–strain graph, yield strength, UTS, Young's modulus), hardness (Brinell, Vickers, Rockwell), impact (Charpy, Izod). Non-destructive tests (NDT): visual, dye penetrant, magnetic particle, ultrasonic, radiography (X-ray)."

points:[
"Ohm's law: V = I × R. Power: P = V × I = I²R = V²/R. Energy = power × time.",
"Series circuits: same current everywhere; total resistance R = R₁ + R₂ + …; supply voltage is shared.",
"Parallel circuits: same voltage across each branch; currents add; 1/R = 1/R₁ + 1/R₂ + … (total is less than the smallest resistor).",
"Kirchhoff's current law: current into a junction = current out. Kirchhoff's voltage law: the sum of voltage drops round a loop = supply voltage.",
"DC flows one way (batteries, electronics). AC reverses direction; UK mains is 230 V rms at 50 Hz. Transformers change AC voltage; rectifiers (diodes) convert AC to DC.",
"Components: resistor (limits current), capacitor (stores charge), inductor (stores energy in a magnetic field), diode (one-way current), LED, transistor (switch/amplifier), relay (low-power circuit switches a high-power circuit), fuse/MCB (protection).",
"Analogue signals vary continuously (e.g. temperature sensor voltage); digital signals have discrete levels (0 or 1). ADCs convert analogue to digital.",
"Logic gates: AND (output 1 only if all inputs are 1), OR (1 if any input is 1), NOT (inverts), NAND (NOT-AND), NOR (NOT-OR), XOR (1 if inputs differ).",
"Electromagnetism underpins motors (current + magnetic field → force), generators (motion + magnetic field → voltage), solenoids and relays."
],

UNITS.push({
n:9, title:"Mechatronics",
sections:["9.1 Key components of a mechatronic system","9.2 Programmable logic controllers (PLCs)","9.3 Hydraulics and pneumatics"],
overview:"How mechanical, electrical, electronic and computer control combine; how PLCs work and are programmed; and the basics of fluid power.",
points:[
"A mechatronic system combines mechanical parts, electronics, sensors, actuators and a controller (microcontroller or PLC) with software. Examples: robots, CNC machines, automatic doors, car ABS.",
"PLC hardware: power supply, CPU (processor and memory), input modules (from switches/sensors), output modules (to motors, valves, lamps), communication ports. Outputs may be relay, transistor or triac type.",
"PLC scan cycle repeats continuously: read inputs → execute the program → update outputs (plus housekeeping/diagnostics). Scan time is usually a few milliseconds.",
"IEC 61131-3 PLC languages: Ladder Diagram (LD), Function Block Diagram (FBD), Structured Text (ST), Instruction List (IL, now deprecated) and Sequential Function Chart (SFC).",
"Ladder logic: rungs run between two power rails; normally open (NO) and normally closed (NC) contacts are inputs; coils are outputs. A latch (seal-in) uses an output's own contact in parallel with the start button. Timers (TON, TOF) and counters (CTU, CTD) add timing and counting.",
"Safety: emergency stops should be hard-wired NC circuits, not relying only on software. Stop buttons are wired NC so a broken wire stops the machine (fail-safe).",
"Pneumatics uses compressed air (typically around 6 bar): clean, fast, cheap, safe in explosive areas, but air is compressible so positioning is less precise and forces are lower.",
"Hydraulics uses oil (often 100+ bar): incompressible, very high force and precise control, but more expensive, risk of leaks, fire and injection injury.",
"Fluid power components: compressor/pump, FRL unit (filter, regulator, lubricator), directional control valves (e.g. 3/2, 5/2), flow control valves, single- and double-acting cylinders, motors. Circuit symbols follow ISO 1219."
],

UNITS.push({
n:10, title:"Engineering and manufacturing control systems",
sections:["10.1 Control system theory","10.2 Sensors and actuators in automation"],
overview:"Open- and closed-loop control, feedback and PID, and the sensors and actuators that connect controllers to the real world.",
points:[
"A system can be shown as input → process → output. Block diagrams show how subsystems connect.",
"Open-loop control has no feedback; the output is not measured (e.g. a basic toaster timer). It is simple and cheap but cannot correct for disturbances.",
"Closed-loop control measures the output with a sensor and feeds it back; the controller compares it to the setpoint and acts on the error (error = setpoint − measured value).",
"On/off (bang-bang) control switches fully on or off, often with hysteresis to stop rapid switching (e.g. a thermostat).",
"PID control: Proportional (output proportional to error), Integral (removes steady-state error over time), Derivative (reacts to rate of change, reduces overshoot).",
"Sensors: thermocouple, thermistor and RTD/PT100 (temperature); LDR and photoelectric (light); strain gauge and load cell (force); inductive (metal) and capacitive proximity; ultrasonic (distance/level); rotary encoder (position/speed); LVDT (linear displacement); pressure transducers.",
"Actuators: AC/DC motors, stepper motors (precise steps, open loop), servo motors (closed-loop position), solenoids, pneumatic/hydraulic cylinders, heaters, valves.",
"Signal conditioning (amplifying, filtering) and conversion (ADC/DAC) connect sensors and actuators to digital controllers. Industrial analogue signals are often 4–20 mA or 0–10 V."
],

n:11, title:"Quality management",
sections:["11.1 Quality standards, assurance, control and improvement","11.2 Standard operating procedures"],
overview:"Quality systems and standards, the difference between assurance and control, tools for improvement, and how SOPs keep work consistent.",
points:[
"Quality means meeting the customer's requirements consistently. Poor quality costs money through scrap, rework, warranty claims and lost reputation.",
"ISO 9001 is the international standard for quality management systems. Related standards: ISO 14001 (environmental), ISO 45001 (health and safety), AS9100 (aerospace), IATF 16949 (automotive).",
"Quality assurance (QA) is planned and preventive — procedures, training, audits. Quality control (QC) is inspection and testing of products to find defects.",
"Total Quality Management (TQM) makes quality everyone's responsibility, focused on the customer and continuous improvement.",
"Statistical process control (SPC) plots samples on control charts with upper and lower control limits to spot a process drifting before it makes defects. Process capability (Cp, Cpk) compares process spread with the tolerance.",
"Problem-solving tools: 5 Whys, fishbone (Ishikawa) diagram, Pareto analysis (80/20), PDCA (Plan–Do–Check–Act), FMEA (failure mode and effects analysis).",
"Audits check that procedures are followed: internal (first-party), customer (second-party) and certification body (third-party). Non-conformances lead to corrective and preventive action (CAPA).",
"Standard operating procedures (SOPs) are written step-by-step instructions so tasks are done the same safe, correct way every time. Formats include simple step lists, hierarchical steps and flowcharts. They must be controlled, version-numbered and reviewed."
],

overview:"The main UK health, safety and environmental laws, who is responsible for what, how to carry out a risk assessment and apply the hierarchy of control.",
points:[
"Health and Safety at Work etc. Act 1974 (HASAWA): the main act. Employers must protect employees and others so far as is reasonably practicable; employees must take care of themselves and others and cooperate.",
"Key regulations: Management of Health and Safety at Work Regs 1999 (risk assessment), PUWER 1998 (work equipment), LOLER 1998 (lifting), COSHH 2002 (hazardous substances), RIDDOR 2013 (reporting injuries, diseases, dangerous occurrences), Manual Handling 1992, PPE at Work 1992 (amended 2022), Electricity at Work 1989, Control of Noise at Work 2005, Work at Height 2005, Confined Spaces 1997, DSE 1992.",
"The HSE enforces the law. Inspectors can issue improvement notices (fix within a time limit) and prohibition notices (stop the activity immediately), and can prosecute.",
"A hazard is something with the potential to cause harm; risk is the likelihood that harm will occur combined with how severe it would be. Risk rating = likelihood × severity.",
"HSE five steps to risk assessment: 1 identify hazards, 2 decide who might be harmed and how, 3 evaluate risks and decide on precautions, 4 record findings and implement them, 5 review and update.",
"Hierarchy of control (most to least effective): eliminate, substitute, engineering controls (guards, extraction), administrative controls (SOPs, permits, training, signs), PPE as a last resort.",
"Safety signs: red = prohibition/fire equipment, blue = mandatory, yellow = warning, green = safe condition/first aid.",
"Specific controls in engineering: machine guarding, lock-out/tag-out (LOTO) isolation, permit-to-work for high-risk tasks, hot-work permits, confined-space entry, noise action values (80 dB(A) lower, 85 dB(A) upper, 87 dB(A) limit).",
"Environmental laws: Environmental Protection Act 1990 (duty of care for waste), WEEE Regulations, Climate Change Act 2008 (net zero by 2050). Waste hierarchy: prevent, reuse, recycle, recover, dispose. ISO 14001 helps manage environmental impact."
],

n:13, title:"Business, commercial and financial awareness",
sections:["13.1 Commercial operations and markets","13.2 Business and commercial practices","13.3 Financial and economic concepts"],
overview:"How engineering businesses are structured, compete and make money, including costs, break-even, profit and wider economic factors.",
points:[
"Business ownership: sole trader, partnership, private limited company (Ltd), public limited company (plc), plus charities and public-sector organisations. Limited companies give owners limited liability.",
"Sectors of the economy: primary (extracting raw materials), secondary (manufacturing and construction), tertiary (services) and quaternary (knowledge/R&D).",
"Markets: supply and demand set prices. Market structures range from monopoly (one supplier) and oligopoly (a few) to many competing firms. Businesses compete on price, quality, innovation, service and lead time.",
"Analysis tools: SWOT (strengths, weaknesses, opportunities, threats) and PESTLE (political, economic, social, technological, legal, environmental). Marketing mix: product, price, place, promotion.",
"Costs: fixed costs don't change with output (rent, salaries, insurance); variable costs rise with output (materials, energy per unit). Total cost = fixed + variable.",
"Break-even point (units) = fixed costs ÷ (selling price − variable cost per unit). The bracketed figure is the contribution per unit.",

"Stock rotation: FIFO (first in, first out) prevents items going out of date. ABC analysis focuses control on high-value 'A' items.",
"Kanban uses cards or empty bins as a visual signal to replenish stock. Barcodes, RFID tags and ERP/MRP software track inventory in real time.",
"Asset management covers the whole life of physical assets (machines, tools, vehicles, buildings): acquire, operate, maintain, upgrade, dispose. ISO 55001 is the asset management standard.",
"An asset register records each asset: ID/tag, location, cost, date bought, depreciation, maintenance and calibration history, and disposal. Good records support maintenance, insurance and audits."

overview:"How projects are defined, planned, controlled and closed, who does what, and the tools used to keep time, cost and quality on track.",
points:[
"A project is a temporary piece of work with a defined start, end and objectives. A programme is a group of related projects managed together for a bigger benefit. A portfolio is all the projects and programmes in an organisation.",
"Project life cycle: initiation (business case, feasibility), planning, execution, monitoring and control, closure (handover, lessons learned).",
"The triple constraint (iron triangle): time, cost and scope/quality. Changing one affects the others.",
"Objectives should be SMART: Specific, Measurable, Achievable, Relevant, Time-bound.",
"Roles: sponsor (owns the business case, provides funding), project manager (plans and controls day to day), project team, stakeholders (anyone affected or interested), project board/steering group. A RACI chart shows who is Responsible, Accountable, Consulted and Informed.",
"Planning tools: work breakdown structure (WBS), Gantt chart (bars against time), network diagram and critical path analysis (CPA). The critical path is the longest sequence of dependent tasks; any delay on it delays the project. Float is how long a non-critical task can slip.",
"Control: milestones, progress reports, budget tracking, change control, risk register (likelihood, impact, owner, mitigation), issue log, contingency.",
"Methodologies: waterfall (sequential stages), agile (short iterative sprints, flexible scope), PRINCE2 (structured, stage-based UK method). Closure includes evaluating success and recording lessons learned."
],

    try { await docRef.set(body); setProblem(''); }
    catch(e) {
      if (e && e.code === 'unavailable') { await new Promise(r=>setTimeout(r, 700+Math.random()*900)); try { await docRef.set(body); setProblem(''); continue; } catch(e2){ e = e2; } }
      if (e && e.code === 'invalid_argument') setProblem('Your access to this app is view-only, so results can only be kept on this device. Ask your tutor to give you Contributor access.');
      else if (e && e.code === 'quota_exceeded') setProblem('The results store is full. Please tell your tutor. Your results are kept on this device for now.');
      else setProblem('Results could not be saved to your account just now. They are kept on this device and will save next time you finish an activity or test.');
    }
  }
  busy = false;
}
function setProblem(msg){ if (msg === saveProblem) return; saveProblem = msg; const b = $('#savebanner'); if (b) { b.hidden = !msg; b.textContent = msg; } }
const bestOf = n => (S && S.best && S.best[n] != null) ? S.best[n] : null;
const actsOf = n => (S && S.acts && S.acts[n]) || [];
const unitPct = u => { const a = actsOf(u.n).length / actCount(u); const b = bestOf(u.n); return Math.round((a*0.5 + (b==null?0:b/100)*0.5)*100); };
function recordAttempt(kind, unit, score, total, scope){
  const pct = Math.round(score/total*100);
  S.attempts = (S.attempts || []).concat([{k:kind, u:unit, s:score, t:total, scope:scope||null, at:new Date().toISOString()}]).slice(-300);
  if (kind === 'u') { S.best = S.best || {}; if (S.best[unit] == null || pct > S.best[unit]) S.best[unit] = pct; }
  if (kind === 'x' && unit) { S.exam = S.exam || {}; if (S.exam[unit] == null || pct > S.exam[unit]) S.exam[unit] = pct; }
  persist();
}
function markDone(n, key){ S.acts = S.acts || {}; const a = S.acts[n] || []; if (!a.includes(key)) { S.acts[n] = a.concat([key]); persist(); } }

async function init(){
  app.innerHTML = '<div class="panel">Loading…</div>';
  const timed = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
  try {
    if (USE_CLOUD && window.claude && typeof window.claude.use === 'function') {
      [db, user] = await Promise.all([timed(claude.use('db'), 10000), timed(claude.use('user'), 10000)]);
    }
  } catch(e) { db = null; user = null; }
  try { if (user) { uid = await user.id(); isTeacher = !!(await user.canEdit()); } } catch(e) { uid = null; }
  if (db && uid) {
    docRef = db.doc('results/' + uid);
    try {
      const snap = await timed(docRef.get(), 10000);
      if (snap) { mode = 'cloud'; S = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null; }
    } catch(e) { mode = 'local'; }
  }
  if (mode !== 'cloud') { S = loadLocal() || blank(); docRef = null; }
  $('#nav-teacher').hidden = !isTeacher;
  window.addEventListener('hashchange', syncFromHash);
  window.addEventListener('popstate', syncFromHash);
  route();
}
const needsRegister = () => !S || !S.name;

// ================= routing =================
let cur = (location.hash || '#home').slice(1) || 'home';
function go(h){
  cur = h;
  try { if (location.hash.slice(1) !== h) history.pushState(null, '', '#' + h); } catch(e) {}
  route();
}
const syncFromHash = () => { cur = (location.hash || '#home').slice(1) || 'home'; route(); };
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
$('#home-link').onclick = () => go('home');
let timerId = null, unsub = null;
function route(){
  clearInterval(timerId); if (unsub) { unsub(); unsub = null; }
  let h = cur || 'home';
  $('#who').textContent = S && S.name ? `${S.name}${S.group ? ' · ' + S.group : ''}` : '';
  document.querySelector('header.top nav').style.visibility = needsRegister() ? 'hidden' : 'visible';
  if (needsRegister() && h !== 'teacher') return renderRegister(false);
  document.querySelectorAll('[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === h || (h.startsWith('unit') && b.dataset.go==='home')));
  const m = h.match(/^unit-(\d+)(?:-(learn|activities|test|exam))?$/);
  if (m) renderUnit(+m[1], m[2] || 'learn');
  else if (h === 'mock') renderMockSetup();
  else if (h === 'glossary') renderGlossary();
  else if (h === 'exam') renderExamHub();
  else if (h.startsWith('exam-')) renderExamPaper(h.slice(5));
  else if (h === 'my-results') renderMyResults();
  else if (h === 'profile') renderRegister(true);
  else if (h === 'teacher' && isTeacher) renderTeacher();
  else renderHome();
  window.scrollTo(0,0);
}
const banners = () => `<div id="savebanner" class="banner" ${saveProblem?'':'hidden'}>${esc(saveProblem)}</div>` +
'';

      <div class="row"><button class="btn orange" type="submit">${editing ? 'Save details' : 'Start learning'}</button>${editing?'<button class="btn alt" type="button" id="cancel">Cancel</button>':''}<span class="fb bad" id="rerr"></span></div>

  if (editing) $('#cancel').onclick = () => go('my-results');

    ({match:actMatch, sort:actSort, order:actOrder, calc:actCalc, scenario:actScenario})[a.type](a, body, finish);

function actMatch(a, body, finish){
  let pick = null, got = 0;
  const draw = () => {
    body.innerHTML = `<p class="hint">Select a term, then select its meaning.</p>
    <div class="match"><div class="col" id="mt">${shuffle(a.pairs.map((p,i)=>[p[0],i])).map(([t,i])=>`<button class="chip" data-i="${i}">${esc(t)}</button>`).join('')}</div>
    <div class="col" id="md">${shuffle(a.pairs.map((p,i)=>[p[1],i])).map(([d,i])=>`<button class="chip" data-i="${i}">${esc(d)}</button>`).join('')}</div></div>
    <div class="row"><span class="fb" id="mfb"></span><button class="btn alt" id="mre">Restart</button></div>`;
    got = 0; pick = null;
    body.querySelectorAll('#mt .chip').forEach(c => c.onclick = () => { body.querySelectorAll('#mt .chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); pick = c; });
    body.querySelectorAll('#md .chip').forEach(c => c.onclick = () => {
      if (!pick) { $('#mfb',body).textContent = 'Pick a term first.'; return; }
      if (pick.dataset.i === c.dataset.i) {
        [pick,c].forEach(x=>{x.classList.remove('sel');x.classList.add('ok','gone');}); pick = null; got++;
        $('#mfb',body).className='fb ok'; $('#mfb',body).textContent = got===a.pairs.length ? `All ${got} matched — well done!` : `Correct (${got}/${a.pairs.length})`;
        if (got===a.pairs.length) finish();
      } else { c.classList.add('bad'); setTimeout(()=>c.classList.remove('bad'),600); $('#mfb',body).className='fb bad'; $('#mfb',body).textContent='Not that one — try again.'; }
    });
    $('#mre',body).onclick = draw;
  };
  draw();
}

function actSort(a, body, finish){
  let sel = null; const place = {}; // item index -> cat index
  const items = shuffle(a.items.map((it,i)=>({t:it[0], c:it[1], i})));
  const draw = (checked) => {
    const chip = it => `<button class="chip ${sel===it.i?'sel':''} ${checked? (place[it.i]===it.c?'ok':'bad'):''}" data-i="${it.i}">${esc(it.t)}</button>`;
    body.innerHTML = `<p class="hint">Select an item, then select the box it belongs in. Select a placed item to move it again.</p>
    <div class="pool">${items.filter(it=>place[it.i]==null).map(chip).join('') || '<span style="color:var(--muted)">All placed — press Check.</span>'}</div>
    <div class="buckets">${a.cats.map((c,ci)=>`<div class="bucket ${sel!=null?'ready':''}" data-c="${ci}" role="button" tabindex="0"><h4>${esc(c)}</h4>${items.filter(it=>place[it.i]===ci).map(chip).join('')}</div>`).join('')}</div>
    <div class="row"><button class="btn" id="sck">Check</button><button class="btn alt" id="sre">Reset</button><span class="fb" id="sfb"></span></div>`;
    body.querySelectorAll('.chip').forEach(c => c.onclick = e => { e.stopPropagation(); const i=+c.dataset.i; sel = sel===i?null:i; draw(); });
    body.querySelectorAll('.bucket').forEach(b => b.onclick = () => { if (sel==null) return; place[sel] = +b.dataset.c; sel = null; draw(); });
    $('#sre',body).onclick = () => { for (const k in place) delete place[k]; sel=null; draw(); };
    $('#sck',body).onclick = () => {
      const placed = Object.keys(place).length;
      if (placed < items.length) { $('#sfb',body).className='fb bad'; $('#sfb',body).textContent=`Place all ${items.length} items first (${placed} placed).`; return; }
      draw(true);
      const right = items.filter(it=>place[it.i]===it.c).length;
      const fb = $('#sfb',body);
      if (right===items.length){ fb.className='fb ok'; fb.textContent=`${right}/${items.length} — perfect!`; finish(); }
      else { fb.className='fb bad'; fb.textContent=`${right}/${items.length} correct. Move the red ones and check again.`; }
    };
  };
  draw();
}

function actOrder(a, body, finish){
  let list = shuffle(a.items.map((t,i)=>({t,i})));
  while (list.length>1 && list.every((x,k)=>x.i===k)) list = shuffle(list);
  const draw = (checked) => {
    body.innerHTML = `<p class="hint">Use the arrows to put the steps in the correct order.</p>
    <ol class="orderlist">${list.map((x,k)=>`<li class="${checked?(x.i===k?'ok':'bad'):''}"><b>${k+1}.</b><span>${esc(x.t)}</span><button class="mini" data-k="${k}" data-d="-1" aria-label="Move up">▲</button><button class="mini" data-k="${k}" data-d="1" aria-label="Move down">▼</button></li>`).join('')}</ol>
    <div class="row"><button class="btn" id="ock">Check order</button><span class="fb" id="ofb"></span></div>`;
    body.querySelectorAll('.mini').forEach(b => b.onclick = () => { const k=+b.dataset.k, j=k+ +b.dataset.d; if (j<0||j>=list.length) return; [list[k],list[j]]=[list[j],list[k]]; draw(); });
    $('#ock',body).onclick = () => { draw(true); const r = list.filter((x,k)=>x.i===k).length; const fb=$('#ofb',body);
      if (r===list.length){fb.className='fb ok';fb.textContent='Correct order!';finish();} else {fb.className='fb bad';fb.textContent=`${r}/${list.length} in the right place.`;} };
  };
  draw();
}

function actCalc(a, body, finish){
  const ok = new Set();
  body.innerHTML = `<p class="hint">Type a number (no units) and press Check. Use "Show working" if you're stuck.</p><div class="calc">${a.qs.map((q,i)=>`
    <div class="q"><div><b>${i+1}.</b> ${esc(q.q)}</div>
    <div class="row" style="margin-top:8px"><input inputmode="decimal" data-i="${i}" aria-label="Answer ${i+1}"> <span>${esc(q.unit||'')}</span>
    <button class="btn" data-ck="${i}">Check</button><button class="btn alt" data-w="${i}">Show working</button><span class="fb" id="cf${i}"></span></div>
    <div class="work" id="cw${i}" hidden>${esc(q.w)}</div></div>`).join('')}</div>`;
  const check = i => {
    const inp = body.querySelector(`input[data-i="${i}"]`), q = a.qs[i];
    const v = parseFloat(inp.value.replace(/[,\s£]/g,'').replace('−','-'));
    const fb = $('#cf'+i, body);
    if (isNaN(v)) { fb.className='fb bad'; fb.textContent='Enter a number.'; return; }
    const good = Math.abs(v - q.ans) <= (q.tol||0) + 1e-9;
    inp.className = good?'ok':'bad'; fb.className = 'fb '+(good?'ok':'bad'); fb.textContent = good?'Correct':'Try again';
    if (good) { ok.add(i); if (ok.size===a.qs.length) finish(); }
  };
  body.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => check(+b.dataset.ck));
  body.querySelectorAll('input').forEach(inp => inp.onkeydown = e => { if (e.key==='Enter') check(+inp.dataset.i); });
  body.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const w=$('#cw'+b.dataset.w, body); w.hidden=!w.hidden; });
}

function actScenario(a, body, finish){
  body.innerHTML = `<div class="panel" style="background:#f4f7f8;border:none;margin-bottom:10px"><b>Task (${a.marks} marks):</b> ${esc(a.prompt)}</div>
    <textarea placeholder="Write your answer here…" aria-label="Your answer"></textarea>
    <div class="row"><button class="btn" id="rev">Show model answer points</button><span class="fb" id="scf"></span></div>
    <div id="mod" hidden><p class="hint" style="margin:10px 0 0">Tick each point your answer covers (1 mark each, up to ${a.marks}).</p>
    <ul class="model">${a.model.map((m,i)=>`<li><label><input type="checkbox" data-m="${i}"> <span>${esc(m)}</span></label></li>`).join('')}</ul></div>`;
  $('#rev',body).onclick = () => { $('#mod',body).hidden = false; finish(); };
  body.querySelectorAll('[data-m]').forEach(c => c.onchange = () => {
    const n = body.querySelectorAll('[data-m]:checked').length; const s = Math.min(n, a.marks);
    $('#scf',body).className='fb ok'; $('#scf',body).textContent = `Self-marked: ${s}/${a.marks}`;
  });
}

    <div class="sticky"><span class="fb" id="qprog">0/${qset.length} answered</span>${opts.minutes?`<span class="timer" id="tm"></span>`:''}<span style="flex:1"></span><button class="btn orange" id="qsub">Submit answers</button></div>

      <div class="opts">${q.order.map((oi,k)=>`<button class="opt" data-q="${qi}" data-o="${oi}"><span class="l">${L[k]}</span><span>${esc(q.o[oi])}</span></button>`).join('')}</div>
      <div class="explain" hidden></div></div>`).join('')}</div>
    <div class="row"><button class="btn orange" id="qsub2">Submit answers</button></div>`;
  let submitted = false;
  pane.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (submitted) return;
    const qi = +b.dataset.q; ans[qi] = +b.dataset.o;
    pane.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x => x.classList.toggle('picked', x===b));
    $('#qprog',pane).textContent = `${Object.keys(ans).length}/${qset.length} answered`;
  });
  const submit = (force) => {
    if (submitted) return;
    const left = qset.length - Object.keys(ans).length;
    const btn = $('#qsub',pane);
    if (left && !force && !btn.dataset.sure) { btn.dataset.sure=1; btn.textContent=`${left} unanswered — submit anyway?`; $('#qsub2',pane).textContent = btn.textContent; return; }
    submitted = true; clearInterval(timerId);
    let right = 0; const byUnit = {};
    qset.forEach((q,qi) => {
      const ok = ans[qi] === 0; if (ok) right++;
      byUnit[q.unit] = byUnit[q.unit] || [0,0]; byUnit[q.unit][1]++; if (ok) byUnit[q.unit][0]++;
      pane.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(x => { const o=+x.dataset.o; if (o===0) x.classList.add('ok'); else if (o===ans[qi]) x.classList.add('bad'); });
      const ex = $(`#q${qi} .explain`, pane); ex.hidden=false; ex.innerHTML = `<b class="fb ${ok?'ok':'bad'}">${ok?'Correct.':(ans[qi]==null?'Not answered.':'Incorrect.')}</b> ${esc(q.e)}`;
    });
    const pct = Math.round(right/qset.length*100);
    if (opts.unit) recordAttempt('u', opts.unit.n, right, qset.length);
    else recordAttempt('m', null, right, qset.length, opts.scope);
    const grade = pct>=80?'Distinction-level':pct>=65?'Merit-level':pct>=50?'Pass-level':'Keep practising';
    const weak = Object.entries(byUnit).filter(([u,[r,t]])=>r/t<0.6).map(([u])=>+u);
    $('#qres',pane).innerHTML = `<div class="score"><b>${right}/${qset.length}</b><div><div class="disp" style="font-size:22px">${pct}% — ${grade}</div><div>Saved to My results. Review the explanations below.${opts.unit?` Best score for this unit: ${bestOf(opts.unit.n)}%`:''}</div></div><span style="flex:1"></span><button class="btn alt" id="again">Try again (new questions)</button></div>
      ${opts.mixed?`<h3>Score by unit</h3><div class="breakdown">${Object.entries(byUnit).sort((a,b)=>a[0]-b[0]).map(([u,[r,t]])=>`<div><b>Unit ${u}</b> — ${r}/${t}</div>`).join('')}</div>${weak.length?`<p><b>Revisit:</b> ${weak.map(u=>`<a href="#unit-${u}" onclick="event.preventDefault();go('unit-${u}')">Unit ${u}</a>`).join(', ')}</p>`:''}`:''}`;
    $('#again',pane).onclick = opts.again;
    ['#qsub','#qsub2'].forEach(id=>{const b=$(id,pane); b.disabled=true; b.textContent='Submitted';});
    window.scrollTo({top: $('#qres',pane).getBoundingClientRect().top + window.scrollY - 150});
  };
  $('#qsub',pane).onclick = () => submit(false);
  $('#qsub2',pane).onclick = () => submit(false);
  if (opts.minutes) {
    let s = opts.minutes*60; const tm = $('#tm',pane);
    const tick = () => { tm.textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; if (s--<=0) { submit(true); } };
    tick(); timerId = setInterval(tick, 1000);
  }
}

function attemptLabel(a){ return a.k === 'u' ? `Unit ${a.u} test` : a.k === 'x' ? `Exam questions – ${a.scope||''} (self-marked)` : `Mock exam${a.scope ? ' ('+a.scope+')' : ''}`; }
function pctClass(p){ return p==null ? '' : p>=70 ? 'c-hi' : p>=50 ? 'c-mid' : 'c-lo'; }
function resultsDetail(R){
  const at = (R.attempts||[]).slice().reverse();

// wires a list of questions; calls onChange(total got, all revealed?)
function wireExam(root, items, onChange){
  const got = items.map(()=>null);
  root.querySelectorAll('.exq').forEach(el => {
    const i = +el.dataset.i, q = items[i];
    const ta = el.querySelector('textarea'), wc = el.querySelector('[data-wc]');
    if (wc) ta.oninput = () => { const n = (ta.value.trim().match(/\S+/g)||[]).length; wc.textContent = n + ' words'; };
    el.querySelector('[data-rev]').onclick = () => {
      el.querySelector('[data-ms]').hidden = false;
      if (!q.ext) { got[i] = 0; el.querySelector('[data-sc]').className='fb ok'; el.querySelector('[data-sc]').textContent = `0/${q.m}`; onChange(got); }
    };
    el.querySelectorAll('[data-ms] input[type=checkbox]').forEach(c => c.onchange = () => {
      got[i] = Math.min(el.querySelectorAll('[data-ms] input:checked').length, q.m);
      const sc = el.querySelector('[data-sc]'); sc.className='fb ok'; sc.textContent = `${got[i]}/${q.m}`; onChange(got);
    });
    const mk = el.querySelector('[data-mk]');
    if (mk) mk.onchange = () => { got[i] = mk.value === '' ? null : +mk.value; const sc = el.querySelector('[data-sc]'); sc.className='fb ok'; sc.textContent = mk.value===''?'':`${mk.value}/12`; onChange(got); };
    const chk = el.querySelector('[data-chk]');
    if (chk) chk.onclick = () => {
      const inp = el.querySelector('.calcin'), cf = el.querySelector('[data-cf]');
      const v = parseFloat(inp.value.replace(/[,\s£%]/g,'').replace('−','-'));
      if (isNaN(v)) { cf.className='fb bad'; cf.textContent='Enter a number'; return; }
      const ok = Math.abs(v - q.calc.ans) <= (q.calc.tol||0) + 1e-9;
      cf.className = 'fb ' + (ok?'ok':'bad'); cf.textContent = ok ? 'Correct final answer' : 'Not the expected answer — check your working';
    };
  });
}

  <div class="panel" style="margin-bottom:18px"><h2 style="margin-top:0">How to answer exam questions</h2>${EXAM_TIPS}</div>
  <div class="panel" style="margin-bottom:18px"><h2 style="margin-top:0">Exam-style questions by unit</h2><div class="row" style="margin-top:0">${UNITS.map(u=>`<button class="btn alt" data-ue="${u.n}">Unit ${u.n}${S.exam&&S.exam[u.n]!=null?' · '+S.exam[u.n]+'%':''}</button>`).join('')}</div></div>
  <div class="panel"><h2 style="margin-top:0">Real past papers</h2><p style="margin:0">City &amp; Guilds publishes official past papers, mark schemes and sample papers for the core exams (qualification 8730). Ask your tutor, or find them on the <a href="${PAST_PAPERS_URL}" target="_blank" rel="noopener">City &amp; Guilds 8730 page</a> under assessment materials.</p></div>`;
  app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => go('exam-'+b.dataset.p));
  app.querySelectorAll('[data-ue]').forEach(b => b.onclick = () => go('unit-'+b.dataset.ue+'-exam'));
}
function renderExamPaper(id){
  let title, items;
  const tag = n => q => ({...q, unit:n});
  if (id === 'A') { title = 'Practice paper A — maths & science focus'; items = [4,5,6,7,8].flatMap(n => EXAM[n].map(tag(n))).concat(EXTENDED.filter(x=>x.set===1).map(x=>({...x,m:12,ext:true}))); }
  else if (id === 'B') { title = 'Practice paper B — engineering in context'; items = [1,2,3,9,10,11,12,13,14,15,16,17].flatMap(n => { const pick = new Set(shuffle(EXAM[n].map((_,k)=>k)).slice(0,2)); return EXAM[n].filter((_,k)=>pick.has(k)).map(tag(n)); }).concat(EXTENDED.filter(x=>x.set===2).map(x=>({...x,m:12,ext:true}))); }
  else if (id === 'X') { title = 'Extended response practice (12 marks each)'; items = EXTENDED.map(x=>({...x,m:12,ext:true})); }
  else return renderExamHub();
  const total = items.reduce((s,q)=>s+q.m,0);
  app.innerHTML = banners() + `<button class="back" id="bk">← Exam practice</button><h1 style="margin:4px 0">${esc(title)}</h1>
    <div class="sticky"><span class="fb">${items.length} questions · ${total} marks</span><span class="timer" id="tm" hidden></span><span style="flex:1"></span>
    <select id="tsel" style="font:inherit;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line)"><option value="0">No timer</option><option value="60">60 min</option><option value="90">90 min</option><option value="150">2 h 30 min (real exam length)</option></select><button class="btn alt" id="tgo">Start timer</button></div>
    <div class="panel" style="margin-bottom:12px"><details><summary><b>Exam tips</b></summary>${EXAM_TIPS}</details></div>
    <div id="exl">${items.map((q,i)=> q.ext ? extendedHTML(q,i) : examQuestionHTML(q,i)).join('')}</div>${examFooter('pp')}`;
  $('#bk').onclick = () => go('exam');
  $('#tgo').onclick = () => { const mins = +$('#tsel').value; clearInterval(timerId); const tm = $('#tm'); if (!mins) { tm.hidden = true; return; }
    let s = mins*60; tm.hidden = false; const tick = () => { tm.textContent = `⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; if (s--<=0) { clearInterval(timerId); tm.textContent = "⏱ Time's up — finish your sentence and mark your answers"; } }; tick(); timerId = setInterval(tick, 1000); };
  wireExam(app, items, wireFooter(app, 'pp', items, title.split(' — ')[0], null));
}

// ================= glossary =================
function renderGlossary(){
  const all = UNITS.flatMap(u => u.terms.map(t=>({t:t[0], d:t[1], u:u.n}))).sort((a,b)=>a.t.localeCompare(b.t));
  app.innerHTML = `<h1>Glossary</h1><input class="search" id="gs" placeholder="Search ${all.length} terms…" aria-label="Search terms"><div class="gloss" id="gl"></div>`;
  const draw = q => { q = q.toLowerCase();
    $('#gl').innerHTML = all.filter(x => !q || (x.t+' '+x.d).toLowerCase().includes(q)).map(x=>`<div><b>${esc(x.t)}</b> <small>Unit ${x.u}</small>${esc(x.d)}</div>`).join('') || '<p>No matches.</p>'; };
  $('#gs').oninput = e => draw(e.target.value); draw('');
}

init();
</script>
</body>
</html>
